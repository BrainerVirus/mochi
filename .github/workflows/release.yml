name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (no tag/publish)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Log release gate decision
        run: |
          BUMP=$(node scripts/release/analyze-release-scope.mjs)
          if [[ -n "$BUMP" ]]; then
            echo "gate open — $BUMP release"
          else
            echo "gate closed — no release"
          fi
      - name: Record pre-release tag
        run: |
          PRE_TAG=$(git describe --tags --abbrev=0 --match="v*" 2>/dev/null || true)
          echo "PRE_TAG=${PRE_TAG}" >> "$GITHUB_ENV"
          echo "pre-release tag: ${PRE_TAG:-<none>}"
      - name: Release
        run: npx semantic-release${{ github.event.inputs.dry-run == 'true' && ' --dry-run' || '' }}
        env:
          # GITHUB_TOKEN-initiated pushes don't trigger workflows, so the v* tag
          # created here needs a PAT (RELEASE_SYNC_TOKEN) to fire release-stable.yml.
          GITHUB_TOKEN: ${{ secrets.RELEASE_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Sync release manifests to main
        id: sync
        if: success() && github.event.inputs.dry-run != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_SYNC_TOKEN: ${{ secrets.RELEASE_SYNC_TOKEN }}
        run: |
          : "${RELEASE_SYNC_TOKEN:?RELEASE_SYNC_TOKEN secret is required for the sync PR to trigger CI}"
          TAG=$(git describe --tags --abbrev=0 --match="v*" 2>/dev/null || true)
          if [[ -z "$TAG" || "$TAG" == "${PRE_TAG:-}" ]]; then
            echo "no new release in this run, skipping sync"; exit 0
          fi
          VERSION=${TAG#v}
          node scripts/release/sync-manifest-version.mjs --set "$VERSION"
          if [[ -z "$(git status --porcelain -- package.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json)" ]]; then
            echo "manifests already match ${TAG}"; exit 0
          fi
          BRANCH="chore/manifest-sync-v${VERSION}"
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            echo "branch ${BRANCH} already exists on origin — previous sync still pending"; exit 1
          fi
          git branch -D "${BRANCH}" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -b "${BRANCH}"
          git add package.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "chore(release): sync manifests to v${VERSION}"
          git push -u origin "${BRANCH}"
          gh pr create --title "chore(release): sync manifests to v${VERSION}" \
            --body "Automated post-release manifest alignment. Sets tracked manifests to released ${VERSION}." \
            --base main --head "${BRANCH}"
          gh pr merge --auto --squash --delete-branch
      - name: Report sync failure
        if: failure() && steps.sync.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release/sync-issue.mjs --tag "$(git describe --tags --abbrev=0 --match='v*' 2>/dev/null || echo unknown)" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --error "manifest sync or auto-merge failed (see job log)"
